version: '3.8'

services:
  influxdb:
    image: influxdb:2.8
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: H3@lthC@re!2026
      DOCKER_INFLUXDB_INIT_ORG: healthcare
      DOCKER_INFLUXDB_INIT_BUCKET: eeg_data
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: hc-eeg-secure-t0ken!2026@api
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    networks:
      - healthcare-network

  data-api:
    build:
      context: .
      dockerfile: Dockerfile.data
    container_name: data-api
    ports:
      - "8000:8000"
    env_file:
      - ./services/.env
    depends_on:
      - influxdb
    networks:
      - healthcare-network

  nginx:
    image: nginx:alpine
    container_name: healthcare-nginx
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nodes/visualization:/usr/share/nginx/html:ro
    depends_on:
      - data-api
      - influxdb
    networks:
      - healthcare-network

volumes:
  influxdb-data:
  influxdb-config:

networks:
  healthcare-network:
    driver: bridge