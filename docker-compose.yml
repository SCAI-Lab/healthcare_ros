version: '3.8'

services:
  influxdb:
    image: influxdb:latest
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=H3@lthC@re!2026
      - DOCKER_INFLUXDB_INIT_ORG=healthcare
      - DOCKER_INFLUXDB_INIT_BUCKET=eeg_data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=hc-eeg-secure-t0ken!2026@api
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    restart: unless-stopped
    networks:
      - healthcare-network

  nginx:
    image: nginx:alpine
    container_name: healthcare-nginx
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nodes/visualization/dashboard/influxdb_realtime_dashboard.html:/usr/share/nginx/html/index.html:ro
      - ./nodes/visualization:/usr/share/nginx/html/visualization:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - influxdb
    restart: unless-stopped
    networks:
      - healthcare-network

  latency-api:
    build:
      context: .
      dockerfile: Dockerfile.latency
    container_name: latency-api
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=hc-eeg-secure-t0ken!2026@api
      - INFLUXDB_ORG=healthcare
      - INFLUXDB_BUCKET=eeg_data
    depends_on:
      - influxdb
    restart: unless-stopped
    networks:
      - healthcare-network

  data-api:
    build:
      context: .
      dockerfile: Dockerfile.data
    container_name: data-api
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=hc-eeg-secure-t0ken!2026@api
      - INFLUXDB_ORG=healthcare
      - INFLUXDB_BUCKET=eeg_data
    depends_on:
      - influxdb
    restart: unless-stopped
    networks:
      - healthcare-network

volumes:
  influxdb-data:
  influxdb-config:

networks:
  healthcare-network:
    driver: bridge
